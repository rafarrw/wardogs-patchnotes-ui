<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WARDOGS Season 02 in numbers</title>
<meta name="description" content="Every balance number that changed in the WARDOGS Season 02 patch, before and after side by side.">
<meta property="og:title" content="WARDOGS Season 02 — balance changes in numbers">
<meta property="og:description" content="Damage, armor, prices, rewards, XP and unlocks: every number that changed in the Season 2 patch. Available in English and Portuguese.">
<meta name="theme-color" content="#131210">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://wsrv.nl" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Saira:wdth,wght@100..125,500..900&display=swap" rel="stylesheet">
<script>
  /* idioma: ?lang= → escolha salva → idioma do sistema (pt ou en) → inglês */
  (function () {
    var lang = null;
    try { var q = new URLSearchParams(location.search).get('lang'); if (q === 'pt' || q === 'en') lang = q; } catch (e) {}
    if (!lang) { try { var s = localStorage.getItem('wd-lang'); if (s === 'pt' || s === 'en') lang = s; } catch (e) {} }
    if (!lang) {
      var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
      for (var i = 0; i < list.length; i++) {
        var l = String(list[i]).toLowerCase();
        if (l.indexOf('pt') === 0) { lang = 'pt'; break; }
        if (l.indexOf('en') === 0) { lang = 'en'; break; }
      }
    }
    window.WD_LANG = lang || 'en';
    document.documentElement.lang = window.WD_LANG === 'pt' ? 'pt-BR' : 'en';
  })();
</script>
<style>
:root{
  color-scheme: dark;
  --page:#131210; --panel:#1a1916; --hover:#22201c; --line:#2d2a25; --grid:#2a2823; --axis:#403c34;
  --ink:#ede9df; --ink-2:#bfb9ac; --muted:#918b7e;
  --mustard:#e0ab2c; --on-mustard:#17150f;
  --dec:#3f88d8; --inc:#d65a2a; --before:#78746a; --mid:#2b2925;
  --ok:#7c9a52; --warn:#d9a032; --bad:#c9483b;
  --thumb:#23211c;
  --display:'Saira','Arial Narrow',sans-serif;
  --text:'Archivo',Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--page);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration-color:var(--mustard);text-underline-offset:3px}
a:hover{color:var(--mustard)}
:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
@media (max-width:600px){.wrap{padding:0 16px}}

/* ---------- topo ---------- */
.hero{
  background-color:#171613;
  background-image:
    repeating-linear-gradient(101deg,rgba(237,233,223,.045) 0 1px,transparent 1px 11px),
    repeating-linear-gradient(97deg,rgba(237,233,223,.022) 0 1px,transparent 1px 5px);
  border-bottom:4px solid var(--mustard);
  padding:68px 0 46px;
}
.brand{display:inline-flex;flex-direction:column;align-items:flex-end;max-width:100%}
.wordmark{font-family:var(--display);font-weight:900;font-stretch:125%;font-size:clamp(50px,12.5vw,152px);line-height:.8;letter-spacing:-.012em;text-transform:uppercase}
.season{margin-top:14px;background:var(--mustard);color:var(--on-mustard);font-family:var(--display);font-weight:700;font-stretch:110%;letter-spacing:.24em;font-size:clamp(14px,2.1vw,22px);line-height:1;padding:8px 8px 8px 16px;text-transform:uppercase}
.hero h1{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:clamp(26px,4vw,40px);line-height:1.05;margin:40px 0 14px;text-transform:uppercase}
.lede{font-size:18px;color:var(--ink-2);max-width:60ch;margin:0}
.lede b{color:var(--ink);font-weight:600}
.src{font-size:14px;color:var(--muted);margin:16px 0 0;max-width:72ch}

/* ---------- navegação ---------- */
.nav{position:sticky;top:0;z-index:30;background:var(--page);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:stretch;gap:16px;height:52px}
.nav-links{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{display:flex;align-items:center;padding:0 12px;color:var(--ink-2);text-decoration:none;font-family:var(--display);font-weight:600;font-stretch:110%;text-transform:uppercase;letter-spacing:.06em;font-size:14px;white-space:nowrap}
.nav-links a:first-child{padding-left:0}
.nav-links a:hover{color:var(--ink)}
.nav-links a.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--mustard)}
.nav-tools{display:flex;align-items:center;gap:16px;flex:none}
.chk{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-family:var(--display);font-weight:600;font-stretch:110%;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);white-space:nowrap;flex:none}
.chk input{appearance:none;-webkit-appearance:none;width:17px;height:17px;margin:0;border:1.5px solid var(--ink-2);display:grid;place-content:center;cursor:pointer;background:transparent}
.chk input::after{content:"";width:9px;height:9px;background:var(--on-mustard);transform:scale(0)}
.chk input:checked{background:var(--mustard);border-color:var(--mustard)}
.chk input:checked::after{transform:scale(1)}
.chk:hover{color:var(--ink)}
.lang button{padding:6px 9px}
@media (max-width:600px){.chk .long{display:none}.nav-tools{gap:10px}}

/* ---------- busca ---------- */
.nav .wrap{position:relative}
.search{display:flex;align-items:center;gap:8px}
.search-box{position:relative;display:flex;align-items:center}
.search-box svg{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.search-box input{width:230px;height:32px;background:var(--panel);border:1px solid var(--axis);border-radius:0;color:var(--ink);font-family:var(--text);font-size:14px;padding:0 30px 0 33px;outline:none;-webkit-appearance:none;appearance:none}
.search-box input:focus{border-color:var(--mustard)}
.search-box input::placeholder{color:var(--muted)}
.search-box input::-webkit-search-cancel-button{display:none}
.search-box kbd{position:absolute;right:7px;font-family:var(--text);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--axis);padding:0 5px;line-height:16px}
.search-btn,.search-close{display:none;place-items:center;width:34px;height:32px;background:transparent;border:1px solid var(--axis);color:var(--ink-2);cursor:pointer;padding:0}
.search-btn:hover,.search-close:hover{color:var(--ink);background:var(--hover)}
.search-res{position:absolute;top:100%;right:20px;width:min(660px,calc(100vw - 32px));max-height:min(72vh,600px);overflow:auto;background:var(--page);border:1px solid var(--axis);z-index:40}
.sr-head,.sr-empty{padding:9px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.sr-empty{border-bottom:0;font-size:14px}
.sr{display:grid;grid-template-columns:56px minmax(0,1fr) auto 76px;grid-template-areas:"th m v d";column-gap:12px;align-items:center;width:100%;padding:8px 14px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);text-align:left;font-family:var(--text);cursor:pointer}
.sr:last-child{border-bottom:0}
.sr:hover,.sr.on{background:var(--hover)}
.sr .th{grid-area:th}
.sr-m{grid-area:m;min-width:0}
.sr-n{display:block;font-size:14.5px;font-weight:500;line-height:1.3}
.sr-c{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.sr-v{grid-area:v;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.sr-v s{text-decoration:none;color:var(--muted)}
.sr-v b{font-weight:600}
.sr-v .to{color:var(--muted)}
.sr-d{grid-area:d;font-size:13.5px;font-weight:600;color:var(--ink-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
@keyframes flash{0%,35%{background:color-mix(in oklab,var(--mustard) 26%,transparent)}100%{background:transparent}}
.flash,.flash>th,.flash>td{animation:flash 2.4s ease-out}
@media (max-width:1099px){
  .search-box{display:none}
  .search-btn{display:grid}
  .nav.searching .nav-links,.nav.searching .chk,.nav.searching .lang,.nav.searching .search-btn{display:none}
  .nav.searching .nav-tools,.nav.searching .search{flex:1}
  .nav.searching .search-box{display:flex;flex:1}
  .nav.searching .search-box input{width:100%}
  .nav.searching .search-close{display:grid}
  .search-box kbd{display:none}
  .search-res{left:0;right:0;width:auto}
}
@media (max-width:600px){
  .sr{grid-template-columns:46px minmax(0,1fr) auto;grid-template-areas:"th m d" "th v v";row-gap:3px;padding:9px 12px}
  .sr-v{text-align:left}
  .search-res{max-height:75vh}
}

/* ---------- legenda ---------- */
.howto{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center;padding:22px 0 0;color:var(--ink-2);font-size:14px}
.howto .k{display:inline-flex;align-items:center;gap:8px}
.howto .fine{flex-basis:100%;color:var(--muted);font-size:13px}
.mk{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.mk.before{background:var(--before)}
.mk.dec{background:var(--dec)}
.mk.inc{background:var(--inc)}
.mk.new{border-radius:0;transform:rotate(45deg);width:9px;height:9px;border:2px solid var(--ink);background:transparent}

/* ---------- seções ---------- */
.sec{padding:60px 0 6px;scroll-margin-top:52px}
.sec h2{display:flex;align-items:center;gap:18px;font-family:var(--display);font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:clamp(28px,5vw,46px);line-height:1;margin:0 0 12px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--line);min-width:24px}
.sec-d{color:var(--ink-2);max-width:66ch;margin:0 0 28px;font-size:17px}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:920px){.cols>*{grid-column:span 12}}
.panel{background:var(--panel);border:1px solid var(--line);padding:20px 22px 16px;min-width:0}
@media (max-width:600px){.panel{padding:16px 14px 12px}}
.ph{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 20px}
.panel h3{font-family:var(--display);font-weight:700;font-stretch:112%;font-size:21px;line-height:1.15;margin:0}
.panel h3.with-th{display:flex;align-items:center;gap:12px}
.panel h4{font-family:var(--display);font-weight:700;font-stretch:108%;font-size:16px;margin:24px 0 4px;color:var(--ink)}
.pd{color:var(--ink-2);font-size:15px;margin:8px 0 14px;max-width:72ch}
.note{color:var(--muted);font-size:13px;margin:14px 0 0;max-width:84ch}
.ctrls{display:flex;flex-wrap:wrap;gap:10px}

.segc{display:inline-flex;border:1px solid var(--axis)}
.segc button{background:transparent;border:0;border-right:1px solid var(--axis);color:var(--ink-2);font-family:var(--display);font-weight:600;font-stretch:108%;font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;cursor:pointer;line-height:1}
.segc button:last-child{border-right:0}
.segc button:hover{color:var(--ink);background:var(--hover)}
.segc button[aria-pressed="true"]{background:var(--mustard);color:var(--on-mustard)}

/* ---------- miniaturas e preview ---------- */
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.nm-t{min-width:0}
.th{width:56px;height:34px;flex:none;object-fit:contain;padding:2px;background:var(--thumb);display:block}
.th-empty{background:transparent}
h3 .th{width:60px;height:40px}
[data-pv]{cursor:zoom-in}
.pv{position:fixed;left:0;top:0;z-index:60;width:302px;background:#1d1b18;border:1px solid var(--axis);padding:10px 10px 9px;pointer-events:none;will-change:transform}
.pv[hidden]{display:none}
.pv img{display:block;width:280px;height:auto;min-height:60px;max-height:220px;object-fit:contain;background:var(--thumb)}
.pv-l{display:block;margin-top:8px;font-family:var(--display);font-weight:700;font-stretch:108%;font-size:15px;line-height:1.2}

/* ---------- lista antes → depois ---------- */
.cl{container-type:inline-size}
.cl-row,.cl-axis{display:grid;grid-template-columns:minmax(150px,270px) minmax(0,1fr) 158px 82px;grid-template-areas:"name track vals delta";align-items:center;column-gap:16px}
.cl-row{padding:6px 8px;margin:0 -8px;min-height:38px}
.cl-row:hover{background:var(--hover)}
.cl-name{grid-area:name;font-size:14.5px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.cl-sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.cl-track{grid-area:track;position:relative;height:22px}
.cl-vals{grid-area:vals;text-align:right;font-variant-numeric:tabular-nums;font-size:14.5px;white-space:nowrap}
.cl-vals s{text-decoration:none;color:var(--muted)}
.cl-vals b{font-weight:600}
.cl-vals .to{color:var(--muted);margin:0 2px}
.cl-delta{grid-area:delta;text-align:right;font-size:14px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ar{font-style:normal;font-size:10px;vertical-align:1px;margin-right:3px}
.ar.inc{color:var(--inc)} .ar.dec{color:var(--dec)}
.isnew{font-family:var(--display);font-weight:700;font-stretch:110%;font-size:12px;letter-spacing:.1em;color:var(--ink)}
.tk{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.rail{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--grid)}
.zero{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--axis)}
.seg{position:absolute;top:50%;height:4px;margin-top:-2px;opacity:.6}
.seg.inc{background:var(--inc)} .seg.dec{background:var(--dec)}
.dot{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;box-shadow:0 0 0 2px var(--panel)}
.cl-row:hover .dot{box-shadow:0 0 0 2px var(--hover)}
.dot.before{background:var(--before)}
.dot.inc{background:var(--inc)} .dot.dec{background:var(--dec)} .dot.same{background:var(--ink-2)}
.dot.new{border-radius:0;transform:rotate(45deg);width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid var(--ink);background:var(--panel);box-shadow:none}
.bar{position:absolute;top:50%;height:12px;margin-top:-6px;min-width:2px}
.bar.inc{background:var(--inc);border-radius:0 1px 1px 0}
.bar.dec{background:var(--dec);border-radius:1px 0 0 1px}
.cl-na{position:absolute;inset:0;display:flex;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.cl-axis{height:22px}
.cl-axis .cl-track{height:22px}
.ax{position:absolute;top:3px;font-size:11.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.ax.first{transform:none}.ax.last{transform:translateX(-100%)}
.cl-group{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:22px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cl-group:first-child{margin-top:4px}
.cl-group .t{font-family:var(--display);font-weight:700;font-stretch:110%;font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.cl-group .n{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.panel h3 + .cl{margin-top:14px}
@container (max-width:620px){
  .cl-row,.cl-axis{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"name vals delta" "track track track";row-gap:6px;column-gap:12px}
  .cl-axis{grid-template-areas:"track track track"}
  .cl-axis>:not(.cl-track){display:none}
  .cl-row{padding:8px 8px}
  .cl-delta{min-width:58px}
  .th{width:46px;height:30px}
}
@media (max-width:600px){.pv{width:262px}.pv img{width:240px}}

/* ---------- ficha técnica ---------- */
.spec{width:100%;border-collapse:collapse;font-size:14.5px}
.spec th,.spec td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.spec tr:last-child th,.spec tr:last-child td{border-bottom:0}
.spec th{text-align:left;font-weight:400;color:var(--ink-2);padding-right:16px}
.spec th small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.spec td{text-align:right;font-family:var(--display);font-weight:700;font-stretch:108%;font-size:19px;white-space:nowrap;color:var(--ink)}
.spec td .ar{font-size:11px}

/* ---------- tabela simples ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--display);font-weight:600;font-stretch:108%;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);text-align:right;padding:8px 0 8px 12px;border-bottom:1px solid var(--axis)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td{text-align:right;padding:9px 0 9px 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* ---------- mapa de calor ---------- */
.heat{width:100%;border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums;min-width:440px}
.heat th{font-family:var(--display);font-weight:600;font-stretch:108%;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding:6px 8px;text-align:center}
.heat tbody th{text-align:left;text-transform:none;letter-spacing:0;font-family:var(--text);font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap}
.heat td{padding:12px 6px;text-align:center;background:var(--mid)}
.heat .v{display:block;font-size:17px;font-weight:700;color:var(--ink)}
.heat .s{display:block;font-size:12px;color:var(--ink);opacity:.8;margin-top:2px}
.heat .ar{color:var(--ink)}
@media (max-width:600px){
  .heat{min-width:0;border-spacing:2px}
  .heat th{font-size:11px;padding:4px 2px;letter-spacing:0}
  .heat tbody th{font-size:12.5px;white-space:normal;padding-right:4px}
  .heat td{padding:9px 2px}
  .heat .v{font-size:14px}
  .heat .s{font-size:10.5px}
}

/* ---------- gráfico de XP ---------- */
.xp{position:relative;margin-top:6px}
.xp svg{display:block;overflow:visible}
.xp .grid{stroke:var(--grid);stroke-width:1}
.xp .base{stroke:var(--axis);stroke-width:1}
.xp .axl{fill:var(--muted);font-size:12px;font-family:var(--text)}
.xp .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.xp .ln.before{stroke:var(--before)} .xp .ln.after{stroke:var(--dec)}
.xp .gap{fill:var(--dec);opacity:.09}
.xp .pt{stroke:var(--panel);stroke-width:2}
.xp .pt.before{fill:var(--before)} .xp .pt.after{fill:var(--dec)}
.xp .endl{fill:var(--ink-2);font-size:12.5px;font-family:var(--text);font-weight:600}
.xp .cross{stroke:var(--axis);stroke-width:1}
.tt{position:absolute;pointer-events:none;background:var(--page);border:1px solid var(--axis);padding:8px 11px;font-size:13px;line-height:1.5;min-width:160px;font-variant-numeric:tabular-nums}
.tt .h{font-family:var(--display);font-weight:700;font-stretch:110%;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.tt .r{display:flex;align-items:center;gap:7px}
.tt .r b{margin-left:auto;font-weight:600}
.tt .mk{width:9px;height:9px}

/* ---------- paraquedas ---------- */
.chute{display:grid;grid-template-columns:64px 1fr;gap:0 14px;margin:10px 0 4px}
.chute-bar{position:relative;height:250px;display:flex;flex-direction:column;border-left:1px solid var(--axis)}
.z-ok{background:color-mix(in oklab,var(--ok) 40%,var(--panel))}
.z-risk{background:color-mix(in oklab,var(--warn) 40%,var(--panel))}
.z-no{background:color-mix(in oklab,var(--bad) 45%,var(--panel))}
.chute-bar .m{position:absolute;left:-1px;transform:translate(-100%,-50%);padding-right:8px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chute-labels{position:relative;height:250px}
.chute-labels div{position:absolute;left:0;right:0;transform:translateY(-50%);font-size:14px;line-height:1.35}
.chute-labels b{font-family:var(--display);font-weight:700;font-stretch:108%;font-size:15px;display:block}
.chute-labels span{color:var(--ink-2);font-size:13.5px}
.chute-wrap{padding-left:42px}

/* ---------- trilhas ---------- */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:14px 0 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:transparent;border:0;color:var(--ink-2);font-family:var(--display);font-weight:600;font-stretch:110%;text-transform:uppercase;letter-spacing:.06em;font-size:14px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tabs button:first-child{padding-left:0}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--mustard)}
.prog-sum{color:var(--ink-2);font-size:15px;margin:14px 0 6px}
.prog-sum b{color:var(--ink);font-weight:600}

footer{margin-top:72px;border-top:1px solid var(--line);padding:28px 0 48px;color:var(--muted);font-size:13.5px}
footer p{margin:0 0 6px;max-width:90ch}
footer a{color:var(--ink-2)}
</style>

<body>

<header class="hero">
  <div class="wrap">
    <div class="brand" aria-hidden="true">
      <div class="wordmark">Wardogs</div>
      <div class="season">Season 02</div>
    </div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" id="lede"></p>
    <p class="src" data-i18n="src"></p>
  </div>
</header>

<nav class="nav" aria-label="Sections">
  <div class="wrap">
    <div class="nav-links">
      <a href="#combate" data-i18n="nav.combat"></a>
      <a href="#construcoes" data-i18n="nav.build"></a>
      <a href="#precos" data-i18n="nav.prices"></a>
      <a href="#recompensas" data-i18n="nav.rewards"></a>
      <a href="#progressao" data-i18n="nav.prog"></a>
      <a href="#outros" data-i18n="nav.other"></a>
    </div>
    <div class="nav-tools">
      <div class="search">
        <button type="button" class="search-btn" id="search-btn" data-i18n-aria="search.open">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.75" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
        </button>
        <div class="search-box">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.75" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
          <input type="search" id="search-in" autocomplete="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="search-res" aria-autocomplete="list" data-i18n-ph="search.ph" data-i18n-aria="search.open">
          <kbd aria-hidden="true">/</kbd>
        </div>
        <button type="button" class="search-close" id="search-close" data-i18n-aria="search.close">

</nav>

<main class="wrap">

  <div class="howto">
    <span class="k"><i class="mk before"></i>Season 1</span>
    <span class="k"><i class="mk dec"></i><span><i class="ar dec">▼</i><span data-i18n="lg.dec"></span></span></span>
    <span class="k"><i class="mk inc"></i><span><i class="ar inc">▲</i><span data-i18n="lg.inc"></span></span></span>
    <span class="k"><i class="mk new"></i><span data-i18n="lg.new"></span></span>
    <span class="fine" data-i18n="lg.fine"></span>
  </div>

  <!-- ================= COMBATE ================= -->
  <section id="combate" class="sec">
    <h2 data-i18n="nav.combat"></h2>
    <p class="sec-d" data-i18n="combat.d"></p>
    <div class="cols">
      <div class="panel s7">
        <h3 data-i18n="calibre.h3"></h3>
        <p class="pd" data-i18n="calibre.pd"></p>
        <div id="cl-calibre"></div>
      </div>
      <div class="panel s5">
        <h3 data-i18n="armor.h3"></h3>
        <p class="pd" data-i18n="armor.pd"></p>
        <div id="cl-armor"></div>
        <h4 data-i18n="through.h4"></h4>
        <div id="cl-through"></div>
      </div>
      <div class="panel s12">
        <h3 data-i18n="heat.h3"></h3>
        <p class="pd" data-i18n="heat.pd"></p>
        <div class="scroll-x"><table class="heat" id="heat"></table></div>
        <p class="note" data-i18n="heat.note"></p>
      </div>
      <div class="panel s6">
        <h3 data-i18n="chute.h3"></h3>
        <div class="chute-wrap">
          <div class="chute" id="chute"></div>
        </div>
        <h4 data-i18n="chute.h4"></h4>
        <div id="cl-chute"></div>
      </div>
      <div class="panel s6">
        <h3 data-i18n="cmisc.h3"></h3>
        <div id="cl-combat-misc"></div>
        <table class="spec" id="spec-combat" style="margin-top:10px"></table>
      </div>
    </div>
  </section>

  <!-- ================= CONSTRUÇÕES ================= -->
  <section id="construcoes" class="sec">
    <h2 data-i18n="nav.build"></h2>
    <p class="sec-d" data-i18n="build.d"></p>
    <div class="cols">
      <div class="panel s12">
        <div class="ph">
          <div><h3 data-i18n="bcost.h3"></h3></div>
          <div class="ctrls" id="ctrl-build"></div>
        </div>
        <p class="pd" data-i18n="bcost.pd"></p>
        <div id="cl-build"></div>
      </div>
      <div class="panel s7">
        <h3 class="with-th" data-th="Drill Rig"><span>Drill Rig</span></h3>
        <p class="pd" data-i18n="drill.pd"></p>
        <div id="cl-drill"></div>
      </div>
      <div class="panel s5">
        <h3 data-i18n="bweap.h3"></h3>
        <p class="pd" data-i18n="rowscale"></p>
        <div id="cl-bweap"></div>
      </div>
    </div>
  </section>

  <!-- ================= PREÇOS ================= -->
  <section id="precos" class="sec">
    <h2 data-i18n="prices.h2"></h2>
    <p class="sec-d" id="price-sum"></p>
    <div class="cols">
      <div class="panel s12">
        <div class="ph">
          <div><h3 data-i18n="price.h3"></h3></div>
          <div class="ctrls" id="ctrl-price"></div>
        </div>
        <p class="pd" data-i18n="price.pd"></p>
        <div id="cl-price"></div>
        <p class="note" data-i18n="price.note"></p>
      </div>
    </div>
  </section>

  <!-- ================= RECOMPENSAS ================= -->
  <section id="recompensas" class="sec">
    <h2 data-i18n="nav.rewards"></h2>
    <p class="sec-d" data-i18n="rewards.d"></p>
    <div class="cols">
      <div class="panel s7">
        <h3 data-i18n="actcash.h3"></h3>
        <div id="cl-act-cash"></div>
      </div>
      <div class="panel s5">
        <h3 data-i18n="actxp.h3"></h3>
        <div id="cl-act-xp"></div>
        <table class="spec" id="spec-rewards" style="margin-top:10px"></table>
      </div>

      <div class="panel s12">
        <h3 data-i18n="log.h3"></h3>
        <p class="pd" data-i18n="log.pd"></p>
        <div class="cols" style="gap:8px 32px">
          <div class="s6"><h4 style="margin-top:4px">Cash</h4><div id="cl-log-cash"></div></div>
          <div class="s6"><h4 style="margin-top:4px">XP</h4><div id="cl-log-xp"></div></div>
        </div>
        <h4 data-i18n="streak.h4"></h4>
        <div class="scroll-x">
          <table class="tbl" id="tbl-streak"></table>
        </div>
      </div>

      <div class="panel s12">
        <div class="ph">
          <div><h3 data-i18n="veh.h3"></h3></div>
          <div class="ctrls" id="ctrl-veh"></div>
        </div>
        <p class="pd" data-i18n="veh.pd"></p>
        <div id="cl-veh"></div>
        <p class="note" data-i18n="veh.note"></p>
      </div>

      <div class="panel s7">
        <h3 data-i18n="bkill.h3"></h3>
        <p class="pd" data-i18n="bkill.pd"></p>
        <div id="cl-bkill"></div>
      </div>
      <div class="panel s5">
        <h3 data-i18n="crate.h3"></h3>
        <div id="cl-crate"></div>
        <h4>Spotting</h4>
        <div id="cl-spot"></div>
      </div>
    </div>
  </section>

  <!-- ================= PROGRESSÃO ================= -->
  <section id="progressao" class="sec">
    <h2 data-i18n="nav.prog"></h2>
    <p class="sec-d" data-i18n="prog.d"></p>
    <div class="cols">
      <div class="panel s12">
        <h3 data-i18n="xp.h3"></h3>
        <p class="pd" data-i18n="xp.pd"></p>
        <div class="xp" id="xp-chart"></div>
        <h4 data-i18n="xp.h4"></h4>
        <div id="cl-xp"></div>
      </div>

      <div class="panel s12">
        <h3 data-i18n="unlock.h3"></h3>
        <div class="tabs" role="tablist" id="prog-tabs"></div>
        <p class="prog-sum" id="prog-sum"></p>
        <div id="cl-prog"></div>
        <p class="note" data-i18n="unlock.note"></p>
      </div>

      <div class="panel s12">
        <div class="ph">
          <div><h3 data-i18n="cost.h3"></h3></div>
          <div class="ctrls" id="ctrl-cost"></div>
        </div>
        <p class="pd" data-i18n="cost.pd"></p>
        <div id="cl-cost"></div>
      </div>
    </div>
  </section>

  <!-- ================= OUTROS ================= -->
  <section id="outros" class="sec">
    <h2 data-i18n="nav.other"></h2>
    <p class="sec-d" data-i18n="other.d"></p>
    <div class="cols">
      <div class="panel s6">
        <h3 data-i18n="omisc.h3"></h3>
        <p class="pd" data-i18n="rowscale"></p>
        <div id="cl-misc"></div>
      </div>
      <div class="panel s6">
        <h3 data-i18n="rules.h3"></h3>
        <table class="spec" id="spec-misc"></table>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
    <p data-i18n="foot3"></p>
  </div>
</footer>

let NF;
const setNF = () => { NF = new Intl.NumberFormat(LANG === 'pt' ? 'pt-BR' : 'en-US', {maximumFractionDigits: 2}); };
setNF();
const F = {
  num: v => NF.format(v),
  money: v => '$' + NF.format(v),
  k: v => v === 0 ? t('free') : v >= 1000 ? '$' + NF.format(v / 1000) + 'k' : '$' + NF.format(v),
  pct: v => NF.format(v) + '%',
  s: v => NF.format(v) + ' s',
  x: v => NF.format(v) + '×',
  slots: v => NF.format(v) + ' ' + (v === 1 ? t('slot') : t('slots')),
  lvl: v => v === 0 ? t('start') : String(v),
};
const compact = v => v >= 1e6 ? NF.format(v / 1e6) + t('M') : v >= 1000 ? NF.format(v / 1000) + t('K') : NF.format(v);
const compactMoney = v => v >= 1000 ? '$' + NF.format(v / 1000) + 'k' : '$' + NF.format(v);

const pctOf = (b, a) => (b == null || a == null || b === 0) ? null : (a - b) / b * 100;
const dirOf = (b, a) => a > b ? 'inc' : a < b ? 'dec' : 'same';
function fmtPct(p) {
  const abs = Math.abs(p);
  const r = abs < 10 ? Math.round(abs * 10) / 10 : Math.round(abs);
  if (r === 0) return '0%';
  return (p > 0 ? '+' : '−') + NF.format(r) + '%';
}
const arrow = d => d === 'inc' ? '<i class="ar inc" aria-hidden="true">▲</i>' : d === 'dec' ? '<i class="ar dec" aria-hidden="true">▼</i>' : '';
const signed = (v, unit) => (v > 0 ? '+' : '−') + NF.format(Math.abs(v)) + unit;

function niceStep(range, count) {
  const raw = range / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function niceDomain(min, max, count) {
  if (max === min) max = min + 1;
  const step = niceStep(max - min, count || 4);
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 1e6; v += step) ticks.push(+v.toFixed(8));
  return {lo, hi, ticks};
}
// escala de variação %: o lado negativo fica justo no menor valor, para não desperdiçar largura
function pctDomain(mn, mx) {
  const step = niceStep(mx - mn, 5);
  const lo = mn < 0 ? (mx > 0 ? mn * 1.06 : Math.floor(mn / step) * step) : 0;
  const hi = mx > 0 ? Math.ceil(mx / step) * step : -mn * 0.06;
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step / 1e6; v += step) ticks.push(+v.toFixed(8));
  if (!ticks.includes(0)) ticks.push(0);
  ticks.sort((x, y) => x - y);
  return {lo, hi, ticks};
}
const pos = (sc, v) => (v - sc.lo) / (sc.hi - sc.lo) * 100;

const STATE = {showNew: false};
const RENDERERS = [];

// índice da busca: cada linha da página vira uma entrada
let SEQ = 0;
const idOf = it => it._id || (it._id = 'r' + (++SEQ));
const SEARCH = [];
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9.]+/g, ' ').trim();
const both = v => v == null ? [] : typeof v === 'object' ? [v.pt, v.en] : [v];
const whereText = w => (I18N.en[w] !== undefined ? t(w) : tx(w));
function addToIndex(e) {
  const it = e.it;
  idOf(it);
  e.id = it._id;
  e.nameHay = norm([...both(it.n), ...both(it.k)].join(' '));
  e.ctxHay = norm([...both(e.group), e.track || '', ...e.cfg.where.map(w => (I18N.en[w] !== undefined ? [I18N.pt[w], I18N.en[w]] : both(w)).join(' '))].join(' '));
  e.order = SEARCH.length;
  SEARCH.push(e);
}

function segHTML(key, options, current) {
  return '<div class="segc" role="group">' + options.map(([v, k]) =>
    `<button type="button" data-k="${key}" data-v="${v}" data-i18n="${k}" aria-pressed="${v === current}">${t(k)}</button>`).join('') + '</div>';
}

function changeList(cfg) {
  const el = document.getElementById(cfg.id);
  if (!el) return;
  el.classList.add('cl');
  cfg.mode = cfg.mode || 'abs';
  cfg.dirFilter = 'all';

  const ctrl = cfg.ctrlId && document.getElementById(cfg.ctrlId);
  if (ctrl) {
    let h = '';
    if (cfg.modes) h += segHTML('mode', [['pct', 'ctl.pct'], ['abs', 'ctl.abs']], cfg.mode);
    if (cfg.filterUI) h += segHTML('dir', [['all', 'ctl.all'], ['inc', 'ctl.inc'], ['dec', 'ctl.dec']], 'all');
    ctrl.innerHTML = h;
    ctrl.addEventListener('click', e => {
      const btn = e.target.closest('button[data-k]');
      if (!btn) return;
      if (btn.dataset.k === 'mode') cfg.mode = btn.dataset.v; else cfg.dirFilter = btn.dataset.v;
      btn.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
      render();
    });
  }
  // usado pela busca: volta o filtro para "todos" para a linha aparecer
  cfg.resetDir = () => {
    if (cfg.dirFilter === 'all') return;
    cfg.dirFilter = 'all';
    if (ctrl) ctrl.querySelectorAll('button[data-k="dir"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === 'all')));
    render();
  };

  const unitOf = it => F[it.f || cfg.unit || 'num'];

  function deltaHTML(it) {
    if (it.isNew) return `<span class="isnew">${t('new')}</span>`;
    if (it.b == null || it.a == null) return '';
    const d = dirOf(it.b, it.a);
    const kind = it.delta || cfg.delta || 'pct';
    let s;
    if (kind === 'diff') s = signed(it.a - it.b, cfg.diffUnit ? t(cfg.diffUnit) : '');
    else if (kind === 'pp') s = signed(it.a - it.b, t('pp'));
    else {
      const p = pctOf(it.b, it.a);
      s = p == null ? (it.b === 0 ? t('was0') : '') : fmtPct(p);
    }
    return arrow(d) + s;
  }

  function absDomain(items) {
    let mx = (typeof cfg.max === 'function' ? cfg.max() : cfg.max) || 0;
    items.forEach(it => {
      if (it.b != null) mx = Math.max(mx, it.b);
      if (it.a != null) mx = Math.max(mx, it.a);
    });
    return niceDomain(0, mx || 1, cfg.ticks || 4);
  }

  function axisHTML(sc) {
    const fmtA = cfg.mode === 'pct'
      ? (v => (v > 0 ? '+' : v < 0 ? '−' : '') + NF.format(Math.abs(v)) + '%')
      : (cfg.axisFmt || unitOf({}));
    const n = sc.ticks.length;
    return '<div class="cl-axis" aria-hidden="true"><div class="cl-track">' +
      sc.ticks.map((v, i) => `<span class="ax${i === 0 ? ' first' : i === n - 1 ? ' last' : ''}" style="left:${pos(sc, v)}%">${fmtA(v)}</span>`).join('') +
      '</div></div>';
  }

  function rowHTML(it, sc, withThumbs) {
    const d =it.isNew ? 'new' : (it.b != null && it.a != null) ? dirOf(it.b, it.a) : 'none';
    let tr = cfg.scale === 'row'
      ? '<i class="rail"></i>'
      : sc.ticks.map(v => `<i class="tk" style="left:${pos(sc, v)}%"></i>`).join('');
    if (cfg.mode === 'pct') {
      const z = pos(sc, 0);
      tr += `<i class="zero" style="left:${z}%"></i>`;
      if (it.p != null) {
        const v = pos(sc, it.p);
        tr += `<span class="bar ${d}" style="left:${Math.min(z, v)}%;width:${Math.abs(v - z)}%"></span>`;
      } else {
        tr += `<span class="cl-na">${it.isNew ? t('na.new') : it.b === 0 ? t('na.free') : ''}</span>`;
      }
    } else if (it.isNew && it.a != null) {
      tr += `<span class="dot new" style="left:${pos(sc, it.a)}%"></span>`;
    } else if (it.b != null && it.a != null) {
      const xb = pos(sc, it.b), xa = pos(sc, it.a);
      tr += `<span class="seg ${d}" style="left:${Math.min(xb, xa)}%;width:${Math.abs(xa - xb)}%"></span>` +
            `<span class="dot before" style="left:${xb}%"></span>` +
            `<span class="dot ${d}" style="left:${xa}%"></span>`;
    } else {
      tr += `<span class="cl-na">${cfg.naText ? t(cfg.naText) : ''}</span>`;
    }
    const name = tx(it.n);
    const sub = cfg.subFn ? cfg.subFn(it) : tx(it.sub);
    const stem = imgKey(it);
    const nameHTML = `${name}${sub ? `<span class="cl-sub">${sub}</span>` : ''}`;
    const inner = withThumbs ? `<span class="nm">${thumb(stem)}<span class="nm-t">${nameHTML}</span></span>` : nameHTML;
    return `<div class="cl-row" data-id="${it._id}"><div class="cl-name"${pvAttrs(stem, name)}>${inner}</div>` +
           `<div class="cl-track" aria-hidden="true">${tr}</div>` +
           `<div class="cl-vals">${valsHTML(it) || '<s>—</s>'}</div><div class="cl-delta">${deltaHTML(it)}</div></div>`;
  }

  function valsHTML(it) {
    const fv = unitOf(it);
    if (it.isNew) return `<b>${fv(it.a)}</b>`;
    if (it.b != null && it.a != null) return `<s>${fv(it.b)}${it.inf ? '*' : ''}</s><span class="to"> → </span><b>${fv(it.a)}</b>`;
    return '';
  }

  // resumo de uma linha para os resultados da busca
  cfg.describe = it => {
    const v = valsHTML(it);
    return {
      vals: v ? (cfg.valPrefix ? cfg.valPrefix() : '') + v : '',
      delta: deltaHTML(it),
      sub: cfg.subFn ? cfg.subFn(it) : tx(it.sub),
    };
  };

  function byPct(x, y) {
    if (x.p == null && y.p == null) return 0;
    if (x.p == null) return 1;
    if (y.p == null) return -1;
    return y.p - x.p;
  }
  const lvlKey = it => it.a != null ? it.a : it.b != null ? it.b : 999;

  function render() {
    const src = typeof cfg.groups === 'function' ? cfg.groups() : cfg.groups;
    const groups = src.map(g => {
      let items = g.items.filter(it => {
        if (it.isNew) return STATE.showNew && cfg.dirFilter === 'all';
        if (cfg.dirFilter === 'all') return true;
        return it.b != null && it.a != null && dirOf(it.b, it.a) === cfg.dirFilter;
      }).map(it => Object.assign({}, it, {_id: idOf(it), p: pctOf(it.b, it.a)}));
      if (cfg.sort === 'pct') items.sort(byPct);
      else if (cfg.sort === 'after') items.sort((x, y) => lvlKey(x) - lvlKey(y));
      return {t: tx(g.t), items};
    }).filter(g => g.items.length);

    if (!groups.length) { el.innerHTML = `<p class="empty">${t('empty')}</p>`; return; }

    const withThumbs = groups.some(g => g.items.some(it => imgKey(it)));

    let shared = null;
    if (cfg.mode === 'pct') {
      let mn = 0, mx = 0;
      groups.forEach(g => g.items.forEach(it => { if (it.p != null) { mn = Math.min(mn, it.p); mx = Math.max(mx, it.p); } }));
      if (mn === 0 && mx === 0) mx = 10;
      shared = pctDomain(mn, mx);
    } else if (cfg.scale !== 'group' && cfg.scale !== 'row') {
      shared = absDomain(groups.flatMap(g => g.items));
    }

    let html = '';
    groups.forEach(g => {
      if (g.t) html += `<div class="cl-group"><span class="t">${g.t}</span><span class="n">${g.items.length} ${g.items.length === 1 ? t('item1') : t('itemN')}</span></div>`;
      if (cfg.scale === 'row' && cfg.mode !== 'pct') {
        g.items.forEach(it => { html += rowHTML(it, absDomain([it]), withThumbs); });
        return;
      }
      const sc = shared || absDomain(g.items);
      html += axisHTML(sc);
      g.items.forEach(it => { html += rowHTML(it, sc, withThumbs); });
    });
    el.innerHTML = html;
  }

  cfg.render = render;
  RENDERERS.push(render);
  render();

  // entra na busca
  if (cfg.where) {
    const entries = cfg.indexItems
      ? cfg.indexItems()
      : (typeof cfg.groups === 'function' ? cfg.groups() : cfg.groups).flatMap(g => g.items.map(it => ({it, group: g.t})));
    entries.forEach(e => addToIndex(Object.assign({cfg}, e)));
  }
}

}

// mapa de calor calibre × proteção
function drawHeat() {
  const el = document.getElementById('heat');
  const cal = [...CALIBRE.map(c => ({n: c.n, k: c.a / 100})), {n: t('heat.other'), k: 1}];
  const arm = [{n: t('heat.none'), r1: 0, r2: 0}, {n: t('heat.l3'), r1: 55, r2: 50}, {n: t('heat.l4'), r1: 65, r2: 60}];
  const maxAbs = 25;
  let h = '<thead><tr><th></th>' + arm.map(a => `<th scope="col">${a.n}</th>`).join('') + '</tr></thead><tbody>';
  cal.forEach(c => {
    h += `<tr><th scope="row">${c.n}</th>`;
    arm.forEach(a => {
      const before = 100 - a.r1;
      const after = c.k * (100 - a.r2);
      const p = (after / before - 1) * 100;
      const d = Math.abs(p) < 0.05 ? 'same' : p > 0 ? 'inc' : 'dec';
      const w = Math.min(Math.abs(p) / maxAbs, 1) * 62;
      const bg = d === 'same' ? 'var(--mid)' : `color-mix(in oklab, var(--${d}) ${w.toFixed(0)}%, var(--mid))`;
      h += `<td style="background:${bg}"><span class="v">${arrow(d)}${d === 'same' ? '0%' : fmtPct(p)}</span><span class="s">${NF.format(Math.round(before * 10) / 10)}% → ${NF.format(Math.round(after * 10) / 10)}%</span></td>`;
    });
    h += '</tr>';
  });
  el.innerHTML = h + '</tbody>';
}

const xpChart = (function () {
  const el = document.getElementById('xp-chart');
  let lastW = 0;
  function draw(force) {
    const W = Math.floor(el.clientWidth);
    if (!W || (W === lastW && !force)) return;
    lastW = W;
    const narrow = W < 520;
    const H = narrow ? 250 : 320;
    const m = {t: 16, r: narrow ? 70 : 96, b: 30, l: narrow ? 52 : 62};
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const xs = lv => m.l + (lv - 10) / 40 * iw;
    const yMax = 1600000;
    const ys = v => m.t + ih - v / yMax * ih;
    let g = '';
    [0, 400000, 800000, 1200000, 1600000].forEach(v => {
      g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${ys(v)}" y2="${ys(v)}" class="${v === 0 ? 'base' : 'grid'}"/>` +
           `<text x="${m.l - 10}" y="${ys(v)}" dy="0.32em" text-anchor="end" class="axl">${compact(v)}</text>`;
    });
    XP.forEach(d => { g += `<text x="${xs(d.lv)}" y="${m.t + ih + 20}" text-anchor="middle" class="axl">${t('lvlax')}${d.lv}</text>`; });
    const pb = XP.map((d, i) => (i ? 'L' : 'M') + xs(d.lv).toFixed(1) + ',' + ys(d.b).toFixed(1)).join('');
    const pa = XP.map((d, i) => (i ? 'L' : 'M') + xs(d.lv).toFixed(1) + ',' + ys(d.a).toFixed(1)).join('');
    const area = pb + XP.slice().reverse().map(d => 'L' + xs(d.lv).toFixed(1) + ',' + ys(d.a).toFixed(1)).join('') + 'Z';
    g += `<path d="${area}" class="gap"/><path d="${pb}" class="ln before"/><path d="${pa}" class="ln after"/>`;
    XP.forEach(d => {
      g += `<circle cx="${xs(d.lv)}" cy="${ys(d.b)}" r="4.5" class="pt before"/><circle cx="${xs(d.lv)}" cy="${ys(d.a)}" r="4.5" class="pt after"/>`;
    });
    const last = XP[XP.length - 1];
    g += `<text x="${xs(50) + 12}" y="${ys(last.b)}" dy="0.32em" class="endl">S1 ${compact(last.b)}</text>`;
    g += `<text x="${xs(50) + 12}" y="${ys(last.a)}" dy="0.32em" class="endl">S2 ${compact(last.a)}</text>`;
    g += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/>`;
    g += `<rect class="hit" x="${m.l - 10}" y="${m.t}" width="${iw + 20}" height="${ih}" fill="transparent"/>`;
    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('xp.aria'))}">${g}</svg>`;
    const tt = document.createElement('div');
    tt.className = 'tt';
    tt.hidden = true;
    el.appendChild(tt);
    const svg = el.querySelector('svg'), cross = svg.querySelector('.cross'), hit = svg.querySelector('.hit');
    function move(ev) {
      const r = svg.getBoundingClientRect();
      const px = ev.clientX - r.left;
      let best = XP[0];
      XP.forEach(d => { if (Math.abs(xs(d.lv) - px) < Math.abs(xs(best.lv) - px)) best = d; });
      const cx = xs(best.lv);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
      tt.innerHTML = `<div class="h">${t('level')} ${best.lv}</div>` +
        `<div class="r"><i class="mk before"></i>Season 1<b>${NF.format(best.b)}</b></div>` +
        `<div class="r"><i class="mk dec"></i>Season 2<b>${NF.format(best.a)}</b></div>` +
        `<div class="r">${arrow('dec')}${t('diff')}<b>${fmtPct(pctOf(best.b, best.a))}</b></div>`;
      tt.hidden = false;
      const tw = tt.offsetWidth;
      let left = cx + 14;
      if (left + tw > W) left = cx - 14 - tw;
      tt.style.left = left + 'px';
      tt.style.top = (m.t + 6) + 'px';
    }
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tt.hidden = true; });
  }
  new ResizeObserver(() => draw(false)).observe(el);
  draw(false);
  return draw;
})();

function costSub(it) {
  const parts = [];
  if (it.from) parts.push(t('from').replace('{x}', it.from));
  if (it.cb != null && it.ca != null) parts.push(`${t('cost')} ${F.k(it.cb)} → ${F.k(it.ca)}${it.ca !== it.cb ? ' ' + arrow(dirOf(it.cb, it.ca)) : ''}`);
  else if (it.ca != null) parts.push(`${t('cost')} ${F.k(it.ca)}`);
  if (it.note) parts.push(tx(it.note));
  return parts.join(' · ');
}

function progSummary() {
  const items = PROG[curTrack].items.filter(i => !i.isNew);
  const lv = items.filter(i => i.b != null && i.a != null);
  const e = lv.filter(i => i.a < i.b).length, l = lv.filter(i => i.a > i.b).length;
  const cost = items.filter(i => i.cb != null && i.ca != null);
  const up = cost.filter(i => i.ca > i.cb).length, dn = cost.filter(i => i.ca < i.cb).length;
  const news = PROG[curTrack].items.filter(i => i.isNew).length;
  let s;
  if (LANG === 'pt') {
    s = `Na trilha <b>${curTrack}</b>: <b>${e}</b> ${e === 1 ? 'item libera' : 'itens liberam'} mais cedo, <b>${l}</b> mais tarde`;
    if (cost.length) s += `; <b>${up}</b> ${up === 1 ? 'ficou mais caro' : 'ficaram mais caros'} para desbloquear e <b>${dn}</b> mais ${dn === 1 ? 'barato' : 'baratos'}`;
    s += '.';
    if (news) s += STATE.showNew
      ? ` A lista também mostra ${news} ${news === 1 ? 'item novo' : 'itens novos'}.`
      : ` Há ainda ${news} ${news === 1 ? 'item novo' : 'itens novos'} (marque “itens novos” no menu para ver).`;
  } else {
    s = `In the <b>${curTrack}</b> track: <b>${e}</b> ${e === 1 ? 'item unlocks' : 'items unlock'} earlier, <b>${l}</b> later`;
    if (cost.length) s += `; <b>${up}</b> got pricier to unlock and <b>${dn}</b> cheaper`;
    s += '.';
    if (news) s += STATE.showNew
      ? ` The list also shows ${news} new ${news === 1 ? 'item' : 'items'}.`
      : ` There ${news === 1 ? 'is' : 'are'} also ${news} new ${news === 1 ? 'item' : 'items'} (tick “new items” in the menu to see ${news === 1 ? 'it' : 'them'}).`;
  }
  document.getElementById('prog-sum').innerHTML = s;
}

const progCfg = {
  id: 'cl-prog', where: ['nav.prog', 'unlock.h3'], unit: 'lvl', delta: 'diff', diffUnit: 'lvlu', sort: 'after',
  groups: () => [{items: PROG[curTrack].items}],
  max: () => PROG[curTrack].max, ticks: 5,
  axisFmt: v => t('lvlax') + v,
  naText: 'na.lvl',
  subFn: costSub,
  valPrefix: () => t('lvlax'),
  indexItems: () => Object.keys(PROG).flatMap(k => PROG[k].items.map(it => ({it, track: k}))),
};
changeList(progCfg);
progSummary();
RENDERERS.push(progSummary);
function selectTrack(k) {
  curTrack = k;
  tabsEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x.dataset.t === k)));
  progCfg.render();
  progSummary();
}
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-t]');
  if (b) selectTrack(b.dataset.t);
});

// Progressão: custo de desbloqueio
changeList({
  id: 'cl-cost', where: ['nav.prog', 'cost.h3'], ctrlId: 'ctrl-cost', unit: 'k', modes: true, mode: 'pct', sort: 'pct', scale: 'group', axisFmt: compactMoney,
  groups: Object.keys(PROG).map(k => ({t: k, items: PROG[k].items.filter(i => i.cb != null && i.ca != null && !i.isNew).map(i => ({n: i.n, b: i.cb, a: i.ca, from: i.from}))})),
  subFn: it => it.from ? t('from').replace('{x}', it.from) : '',
});

// Outros
changeList({id: 'cl-misc', where: ['nav.other', 'omisc.h3'], groups: one(MISC), scale: 'row'});

// miniatura em títulos (ex.: Drill Rig)
document.querySelectorAll('[data-th]').forEach(h => {
  const stem = imgOf(h.dataset.th);
  if (!stem) return;
  h.insertAdjacentHTML('afterbegin', thumb(stem));
  h.setAttribute('data-pv', stem);
  h.setAttribute('data-pvl', h.dataset.th);
});

/* =================================================================
   TOTAL DE NÚMEROS ALTERADOS
   ================================================================= */
const TOTAL = (function () {
  const pairs = arr => arr.filter(i => !i.isNew && !i.inf && i.b != null && i.a != null && i.b !== i.a).length;
  const progItems = Object.values(PROG).flatMap(tr => tr.items).filter(i => !i.isNew);
  return pairs(CALIBRE) + pairs(ARMOR) + pairs(COMBAT_MISC) + pairs(BUILD) + pairs(DRILL) + pairs(BWEAP) +
    pairs(PRICES.flatMap(g => g.items)) + pairs(ACT_CASH) + pairs(ACT_XP) + pairs(LOG_CASH) + pairs(LOG_XP) +
    pairs(VEH_KILL.flatMap(g => g.items)) + pairs(BKILL) + pairs(CRATE) + pairs(SPOT) + pairs(XP) + pairs(MISC) +
    progItems.filter(i => i.b != null && i.a != null && i.b !== i.a).length +
    progItems.filter(i => i.cb != null && i.ca != null && i.cb !== i.ca).length +
    SPEC_COMBAT.filter(s => s.chg).length + SPEC_MISC.filter(s => s.chg).length;
})();

function applyStatic() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.getElementById('lede').innerHTML = t('lede').replace('{n}', NF.format(TOTAL));
  document.title = t('doc.title');
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', t('doc.desc'));
  document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
}

function setLang(l) {
  if (l === LANG) return;
  LANG = l;
  setNF();
  try { localStorage.setItem('wd-lang', l); } catch (e) {}
  applyStatic();
  RENDERERS.forEach(f => f());
}
document.querySelector('.lang').addEventListener('click', e => {

const toggleNew = document.getElementById('toggle-new');
toggleNew.addEventListener('change', () => {
  STATE.showNew = toggleNew.checked;
  RENDERERS.forEach(f => f());
});

(function navSpy() {
  const links = [...document.querySelectorAll('.nav-links a')];
  const map = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        links.forEach(a => a.classList.remove('on'));
        const a = map.get(en.target.id);
        if (a) a.classList.add('on');
      }
    });
  }, {rootMargin: '-45% 0px -50% 0px'});
  document.querySelectorAll('main section[id]').forEach(s => io.observe(s));
})();

/* =================================================================
   BUSCA
   ================================================================= */
(function search() {
  const nav = document.querySelector('.nav');
  const input = document.getElementById('search-in');
  const res = document.getElementById('search-res');
  const openBtn = document.getElementById('search-btn');
  const closeBtn = document.getElementById('search-close');
  let hits = [], active = -1;

  function find(q) {
    const tokens = norm(q).split(' ').filter(Boolean);
    if (!tokens.length) return [];
    const full = tokens.join(' ');
    const out = [];
    SEARCH.forEach(e => {
      const inName = tokens.every(tk => e.nameHay.includes(tk));
      const inAll = inName || tokens.every(tk => (e.nameHay + ' ' + e.ctxHay).includes(tk));
      if (!inAll) return;
      let rank = 3;
      if (inName) rank = e.nameHay.startsWith(full) ? 0 : (' ' + e.nameHay).includes(' ' + tokens[0]) ? 1 : 2;
      out.push({e, rank});
    });
    out.sort((a, b) => a.rank - b.rank || a.e.order - b.e.order);
    // se algum nome de item bateu, ignora os que só bateram pelo título do painel/grupo
    const named = out.filter(o => o.rank < 3);
    return (named.length ? named : out).slice(0, 60).map(o => o.e);
  }

  function ctxOf(e) {
    const parts = e.cfg.where.map(whereText);
    if (e.group) parts.push(tx(e.group));
    if (e.track) parts.push(e.track);
    return parts.join(' · ');
  }

  function render() {
    const q = input.value.trim();
    if (!q) { close(false); return; }
    hits = find(q);
    active = hits.length ? 0 : -1;
    if (!hits.length) {
      res.innerHTML = `<div class="sr-empty">${t('search.none').replace('{q}', esc(q))}</div>`;
    } else {
      res.innerHTML = `<div class="sr-head">${hits.length === 1 ? t('search.one') : t('search.many').replace('{n}', hits.length)}</div>` +
        hits.map((e, i) => {
          const it = e.it, d = e.cfg.describe(it);
          const sub = [ctxOf(e), d.sub].filter(Boolean).join(' · ');
          return `<button type="button" class="sr${i === active ? ' on' : ''}" role="option" id="sr-${i}" data-i="${i}" aria-selected="${i === active}">` +
            `${thumb(imgKey(it))}<span class="sr-m"><span class="sr-n">${tx(it.n)}</span><span class="sr-c">${sub}</span></span>` +
            `<span class="sr-v">${d.vals}</span><span class="sr-d">${d.delta}</span></button>`;
        }).join('');
    }
    res.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  }

  function setActive(i) {
    if (!hits.length) return;
    active = (i + hits.length) % hits.length;
    res.querySelectorAll('.sr').forEach(b => {
      const on = Number(b.dataset.i) === active;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', String(on));
      if (on) b.scrollIntoView({block: 'nearest'});
    });
    input.setAttribute('aria-activedescendant', 'sr-' + active);
  }

  function close(clear) {
    res.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
    if (clear) { input.value = ''; nav.classList.remove('searching'); }
  }

  function go(e) {
    const it = e.it;
    close(true);
    input.blur();
    if (it.isNew && !STATE.showNew) {
      toggleNew.checked = true;
      STATE.showNew = true;
      RENDERERS.forEach(f => f());
    }
    if (e.track && e.track !== curTrack) selectTrack(e.track);
    let row = document.querySelector(`[data-id="${e.id}"]`);
    if (!row && e.cfg.resetDir) { e.cfg.resetDir(); row = document.querySelector(`[data-id="${e.id}"]`); }
    if (!row) return;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    row.scrollIntoView({block: 'center', behavior: reduce ? 'auto' : 'smooth'});
    row.classList.remove('flash');
    void row.offsetWidth;
    row.classList.add('flash');
  }

  input.addEventListener('input', render);
  input.addEventListener('focus', () => { if (input.value.trim()) render(); });
  input.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); setActive(active + 1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); setActive(active - 1); }
    else if (ev.key === 'Enter') { ev.preventDefault(); if (hits[active]) go(hits[active]); }
    else if (ev.key === 'Escape') { close(true); input.blur(); }
  });
  res.addEventListener('click', ev => {
    const b = ev.target.closest('.sr');
    if (b) go(hits[Number(b.dataset.i)]);
  });
  openBtn.addEventListener('click', () => { nav.classList.add('searching'); input.focus(); });
  closeBtn.addEventListener('click', () => close(true));
  document.addEventListener('pointerdown', ev => {
    if (!res.hidden && !ev.target.closest('.search') && !ev.target.closest('.search-res')) close(false);
  });
  // atalho: "/" abre a busca
  document.addEventListener('keydown', ev => {
    if (ev.key !== '/' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    ev.preventDefault();
    nav.classList.add('searching');
    input.focus();
  });
  RENDERERS.push(() => { if (!res.hidden) render(); });
})();

/* =================================================================
   PREVIEW DA IMAGEM (segue o mouse)
   ================================================================= */
(function preview() {
  const pv = document.getElementById('pv');
  const img = pv.querySelector('img'), lab = pv.querySelector('.pv-l');
  let cur = null, lastX = 0, lastY = 0;
  const GAP = 18;

  function place(x, y) {
    lastX = x; lastY = y;
    const w = pv.offsetWidth, h = pv.offsetHeight;
    let left = x + GAP, top = y + GAP;
    if (left + w > window.innerWidth - 8) left = x - GAP - w;
    if (top + h > window.innerHeight - 8) top = y - GAP - h;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    pv.style.transform = `translate3d(${Math.round(left)}px, ${Math.round(top)}px, 0)`;
  }
  function show(el, x, y) {
    const stem = el.getAttribute('data-pv');
    if (cur !== el) {
      cur = el;
      img.removeAttribute('data-fb');
      img.setAttribute('data-orig', imgOrig(stem));
      img.src = imgURL(stem, 560);
      lab.textContent = el.getAttribute('data-pvl') || '';
    }
    pv.hidden = false;
    place(x, y);
  }
  function hide() { pv.hidden = true; cur = null; }
  // a altura muda quando a imagem chega; reposiciona para não sair da tela
  img.addEventListener('load', () => { if (cur) place(lastX, lastY); });

  document.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const el = e.target.closest('[data-pv]');
    if (el) show(el, e.clientX, e.clientY);
  });
  document.addEventListener('pointermove', e => {
    if (!cur || e.pointerType === 'touch') return;
    if (!cur.contains(e.target)) { hide(); return; }
    place(e.clientX, e.clientY);
  });
  document.addEventListener('pointerout', e => {
    if (!cur) return;
    if (!e.relatedTarget || !cur.contains(e.relatedTarget)) { if (e.pointerType !== 'touch') hide(); }
  });
  // no celular: toque no item abre, toque fora fecha
  document.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    const el = e.target.closest('[data-pv]');
    if (el) show(el, e.clientX, e.clientY - 40); else hide();
  });
  window.addEventListener('scroll', () => { if (cur) hide(); }, {passive: true});

  // se o redimensionador falhar, usa a imagem original
  document.addEventListener('error', e => {
    const im = e.target;
    if (im && im.tagName === 'IMG' && im.dataset.orig && !im.dataset.fb) {
      im.dataset.fb = '1';
      im.src = im.dataset.orig;
    }
  }, true);
})();

})();
</script>
